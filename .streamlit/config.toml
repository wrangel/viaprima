# Brand tokens, shared with abstractaltitudes.
#
# These are the same values as that project's :root in Global.css - black
# ground, white text, #4da6ff accent, hairline borders at 10% white - so the
# two sites read as the work of one person. Keeping them here rather than in
# injected CSS means they survive Streamlit upgrades and apply to widgets this
# project never styles by hand.
#
# Font: abstractaltitudes uses Inter Variable. It is deliberately NOT pulled
# from a CDN here. Apart from Cloudflare, which is in front of the site anyway
# and adds the Web Analytics script (SECURITY.md), the page loads nothing from
# elsewhere, and a webfont request would hand every visitor's IP address to
# whoever hosts it. The stack below resolves to SF on Apple devices and Segoe UI on Windows,
# both neutral grotesques close to Inter. To use Inter itself, self-host the
# woff2 files under static/ with server.enableStaticServing and point
# theme.fontFaces at them - then the claim stays true and the brand is exact.

[theme]
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
baseFontSize = 16

# Visitors choose between System, Light and Dark in Streamlit's menu, so the
# brand has to hold in both. Dark is abstractaltitudes' palette exactly.
[theme.dark]
backgroundColor = "#000000"
secondaryBackgroundColor = "#0e1117"
textColor = "#ffffff"
primaryColor = "#4da6ff"
linkColor = "#4da6ff"
borderColor = "rgba(255, 255, 255, 0.1)"
# Streamlit's default blends backgroundColor and secondaryBackgroundColor,
# which on black is invisible. One step up from black: slight but visible.
dataframeHeaderBackgroundColor = "#1a1d23"

# Light is the same brand inverted. The accent is darkened for links: #4da6ff
# on white is about 2.6:1, below the 4.5:1 body text needs; #1f73c2 is 4.9:1.
# The wordmark keeps #4da6ff in both modes - a logotype is exempt from the
# contrast rule, and it is the brand colour.
[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#111111"
primaryColor = "#1f73c2"
linkColor = "#1f73c2"
borderColor = "rgba(0, 0, 0, 0.1)"
# The default blend was barely there; matched in weight to the dark header.
dataframeHeaderBackgroundColor = "#eef1f5"

[browser]
gatherUsageStats = false

name: CI Workflow

# The job name below ("check") is what a branch ruleset asks for under
# "Require status checks to pass". Renaming the job means updating the rule.
#
# Three things get checked: that the pinned dependencies resolve and install,
# that every module compiles, and that the chain of computation still produces
# the same numbers as the hand calculation (test_calculation.py).
#
# That third point is why a green check on a Renovate PR says anything at all -
# and why Renovate may merge on it:
# the whole app is a chain of computation over pandas. If the behaviour of
# groupby, idxmin or str.extract changed, a wrong tipping point would come out
# without complaint - installation and compilation would be none the wiser.
#
# The tests need neither network nor pytest.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "feature/*"
      - "bugfix/*"
  pull_request:
    branches:
      - main

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fails if a Streamlit update moved what the image build patches. Without
      # this, an automerged Streamlit bump would ship the bare "Streamlit" title
      # to search engines and link previews without anyone noticing.
      - name: Static page can still be patched
        run: python scripts/patch_streamlit_head.py

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Arithmetic tests (no network)
        run: python test_calculation.py

      # The crawler policy: no allowed search engine, archive or answer bot
      # may be caught by the block list (matching is by substring).
      - name: robots.txt policy
        run: python test_robots.py
